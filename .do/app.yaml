# DigitalOcean App Platform — exemplo de spec
# Ajuste name, region, repo e envs. Não commite secrets reais.
#
# Uso:
#   doctl apps create --spec .do/app.yaml
# ou cole no App Platform → Create App → App Spec.
#
# Banco: crie um Managed Postgres separado e preencha DATABASE_* abaixo
# (Connection details no painel do cluster, host privado preferível se VPC).

name: montsystem-api
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: SEU_ORG/api-montsystem
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_SSL
        value: "true"
      - key: TYPEORM_SYNC
        value: "false"
      - key: DATABASE_HOST
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_PORT
        value: "25060"
      - key: DATABASE_USER
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_NAME
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CORS_ORIGINS
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_USER
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_REGION
        value: sfo3
      - key: DO_SPACES_ENDPOINT
        value: https://sfo3.digitaloceanspaces.com
      - key: DO_SPACES_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_PUBLIC_URL
        scope: RUN_TIME
        type: SECRET
      - key: DO_SPACES_KEY_PREFIX
        value: tickets
